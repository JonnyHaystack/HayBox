[env:jz-stm32-leverless]
extends = stm32_base
; Actual MCU is F103RFT6 (XL-density, 768KB), but maple core only supports up to
; F103RE (high-density, 512KB). Same 64-pin LQFP pinout; firmware fits in 512KB.
board = genericSTM32F103RE
board_upload.maximum_ram_size = 98304
board_upload.offset_address = 0x08001000
board_build.ldscript = stm32f103re_bootloader.ld
extra_scripts =
    post:config/jz-stm32-leverless/patch_usb_polling.py
    post:config/jz-stm32-leverless/override_vect.py
; DFU bootloader on PA11/PA12: hold B1 + reset to enter DFU mode, then:
;   dfu-util -a 0 -s 0x08001000:leave -D .pio/build/jz-stm32-leverless/firmware.bin
upload_protocol = dfu
upload_command = dfu-util -a 0 -s 0x08001000:leave -D $SOURCE
build_flags =
    ${stm32_base.build_flags}
    -include config/jz-stm32-leverless/usb_disc_override.h
build_src_filter =
    ${stm32_base.build_src_filter}
    +<config/jz-stm32-leverless>
